[project]
name = "ai-cloud-validation"
version = "1.1.0"
description = "NVIDIA AI Cloud Validation Suite"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Alexandre Begnoche", email = "abegnoche@nvidia.com" },
    { name = "Pedro Marques da Luz", email = "daluz@nvidia.com" },
]
requires-python = ">=3.12"
dependencies = ["isvctl", "isvtest", "isvreporter"]

[tool.uv.sources]
isvctl = { workspace = true }
isvtest = { workspace = true }
isvreporter = { workspace = true }

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.0.0",
]
lint = [
    "pre-commit>=4.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv.workspace]
members = ["isvctl", "isvtest", "isvreporter"]

# Pin transitive dependencies with known vulnerabilities until upstream minimums catch up.
[tool.uv]
required-version = ">=0.13.5"
# Security floors for transitive dependencies; preserve upstream compatibility constraints.
constraint-dependencies = [
    "idna>=3.15",
    "lxml>=6.1.1",
    "oauthlib>=4.0.1",
    "pygments>=2.20.0",
    "virtualenv>=21.14.13",
]
override-dependencies = [
    "certifi>=2026.10.23",
    "cryptography>=50.0.2",
    "pyasn1>=0.6.5",
    "requests>=2.33.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "A", "UP", "RUF"]
ignore = ["E501"]
